# Loreon Pay — merchant dashboard vocabulary.
#
# The upstream vocabulary was only ever a skin over a generic
# catalog/cart/checkout/orders flow. These keys re-point that same flow at a
# payment provider's merchant console.
#
# Domain mapping (see capstone-devops-aws/app/BRANDING.md):
#   catalog  -> payment products a merchant can enable
#   cart     -> the activation basket ("pending activation")
#   checkout -> onboarding / go-live request
#   orders   -> activated products + settlement records

