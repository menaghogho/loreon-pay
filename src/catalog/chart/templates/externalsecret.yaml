{{- with .Values.app.persistence.secret }}
{{- if .external.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  refreshInterval: {{ .external.refreshInterval }}
  secretStoreRef:
    name: {{ .external.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    - secretKey: LOREONPAY_CATALOG_PERSISTENCE_USER
      remoteRef:
        key: {{ .external.remoteKey }}
        property: username
    - secretKey: LOREONPAY_CATALOG_PERSISTENCE_PASSWORD
      remoteRef:
        key: {{ .external.remoteKey }}
        property: password
{{- end }}
{{- end }}
