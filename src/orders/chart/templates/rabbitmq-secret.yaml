{{- if and .Values.app.messaging.rabbitmq.secret.create (not .Values.app.messaging.rabbitmq.secret.external.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.messaging.rabbitmq.secret.name }}
data:
  {{- if .Values.app.messaging.rabbitmq.secret.username }}
  LOREONPAY_ORDERS_MESSAGING_RABBITMQ_USERNAME: {{ .Values.app.messaging.rabbitmq.secret.username | b64enc | quote }}
  {{- end }}
  {{- if .Values.app.messaging.rabbitmq.secret.password }}
  LOREONPAY_ORDERS_MESSAGING_RABBITMQ_PASSWORD: {{ .Values.app.messaging.rabbitmq.secret.password | b64enc | quote }}
  {{- end }}
{{- end }}