{{- if and .Values.app.persistence.secret.create (not .Values.app.persistence.secret.external.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.persistence.secret.name }}
data:
  LOREONPAY_ORDERS_PERSISTENCE_USERNAME: {{ .Values.app.persistence.secret.username | b64enc | quote }}
  LOREONPAY_ORDERS_PERSISTENCE_PASSWORD: "{{ include "orders.postgresql.password" . }}"
{{- end }}